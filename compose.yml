x-backend:
  &backend
  image: puretrace_backend:latest
  build:
    context: .
    dockerfile: docker/development/server/Dockerfile
  env_file:
    - docker/development/server/.env
    - docker/development/postgres/.env
  volumes:
    - ./server:/opt/rails
    - bundle-cache:/usr/local/bundle:cached

services:

  client:
    command: pnpm start
    build:
      context: .
      dockerfile: docker/development/client/Dockerfile
      args:
        REACT_APP_API_URL: http://rails:3006
    ports:
      - 4000:4000
    volumes:
      - "./client:/app"
    env_file:
      - docker/development/client/.env
    ulimits:
      nproc: 10000000
      nofile:
        soft: 1048576
        hard: 1048576
  server:
    <<: *backend
    command: bundle exec puma -C config/puma.rb
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  sidekiq:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      server:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - 7433:7433
    healthcheck:
      test: curl 0.0.0.0:7433
      interval: 10s
      start_period: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 1gb --loglevel warning --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - redis-db:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      start_period: 20s
      timeout: 10s

  postgres:
    image: postgres:14-alpine
    network_mode: host
    ports:
      - 5432:5432
    env_file:
      - docker/development/postgres/.env
    volumes:
      - "postgres-db:/var/lib/postgresql/data"
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  bundle-cache:
  redis-db:
  postgres-db: